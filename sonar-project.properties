# SonarQube project configuration for vuln-triage-harness
# Analyze with: sonar-scanner

sonar.projectKey=Hasan26ozcan_vuln-triage-harness
sonar.organization=hasan26ozcan
sonar.projectName=vuln-triage-harness
sonar.projectVersion=0.1.0

# ---- Sources & tests ---------------------------------------------------------
sonar.sources=app,scripts
sonar.tests=tests
sonar.python.version=3.11

# ---- Coverage ---------------------------------------------------------------
# CI generates coverage XML via: pytest --cov=app --cov-report=xml:coverage.xml
sonar.coverage.reportPaths=coverage.xml
sonar.python.coverage.reportPaths=coverage.xml

# ---- Exclusions (avoid noise from generated/venv/large dirs) ----------------
sonar.exclusions=\
  **/*.pyc,\
  **/*.pyo,\
  **/.venv/**,\
  **/venv/**,\
  **/__pycache__/**,\
  **/output/**,\
  **/data/downloads/**,\
  **/tools/llama-cpp/**,\
  **/.git/**,\
  **/migrations/**,\
  **/.claude/**

sonar.coverage.exclusions=\
  tests/**,\
  scripts/**,\
  app/**/cli.py

# ---- Test exclusions from coverage ------------------------------------------
sonar.coverage.testa.exclusions=\
  tests/**

# ---- Duplication -------------------------------------------------------------
sonar.cpd.exclusions=\
  tests/**,\
  scripts/**

# ---- Pull request decoration -------------------------------------------------
# When running in CI with PR context, uncomment:
# sonar.pullrequest.base=main
# sonar.pullrequest.branch=${GITHUB_REF_NAME}
# sonar.pullrequest.key=${GITHUB_PR_NUMBER}
