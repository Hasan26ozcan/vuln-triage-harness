# Stage 9 — real-time GPU serving (llama.cpp CUDA build, RTX 4060+).
# Requires NVIDIA Container Toolkit on the host (`nvidia-ctk`) so Docker
# can see the GPU. Verify first with:
#   docker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi
# Then bring it up on its own (it's opt-in, not part of the default
# `docker compose up`):
#   docker compose --profile gpu up serving-gpu
services:
  serving-gpu:
    build:
      context: .
      dockerfile: app/serving/Dockerfile.gpu
    container_name: vuln-triage-serving-gpu
    profiles: ["gpu"]
    # Override the NVIDIA entrypoint which exits before CMD is executed.
    entrypoint: []
    ports:
      - "8000:8000"
    volumes:
      - vuln-triage-model:/models:ro
    environment:
      MODEL_PATH: /models/${GGUF_MODEL_FILE:-model.gguf}
      BACKEND_TYPE: llama.cpp
      N_GPU_LAYERS: -1
      NUM_CTX: "4096"
      # Only resolves when run together with docker-compose.infra.yml
      # (`docker compose -f docker-compose.infra.yml -f docker-compose.yml up`).
      # The /api/v1/serve* endpoints don't need Redis at all; only the
      # /api/v1/tasks/* (Celery) endpoints do, and they correctly return
      # 503 if Redis is unreachable — CELERY_TASK_ALWAYS_EAGER=false makes
      # sure they queue to the real workers instead of silently running
      # in-process when infra isn't actually present.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CELERY_TASK_ALWAYS_EAGER: "false"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  vuln-triage-model:
