services:
  postgres:
    image: postgres:16-alpine
    container_name: vuln-triage-postgres
    environment:
      POSTGRES_USER: vuln_triage
      POSTGRES_PASSWORD: vuln_triage
      POSTGRES_DB: vuln_triage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vuln_triage"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vuln-triage-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: vuln-triage-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vuln_triage
      MINIO_ROOT_PASSWORD: vuln_triage_secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
