[project]
name = "vuln-triage-harness"
version = "0.1.0"
description = "Vulnerability triage & patch-suggestion fine-tuning harness: SFT/LoRA/DPO on a code LLM, validated by an exec-based, four-tier eval harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hasan Ozcan" }]

dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "celery>=5.4",
    "redis>=5.0",
    "boto3>=1.34",           # MinIO/S3 client
    "typer>=0.12",           # CLI (Stage 9)
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy ML deps are split out so CI (Stage 0-3, 6 tier 1-2, 10) never needs
# a GPU or a multi-GB torch install just to run schema/unit tests.
ml = [
    "torch>=2.3",
    "transformers>=4.42",
    "peft>=0.11",
    "trl>=0.9",
    "bitsandbytes>=0.43",
    "sentence-transformers>=3.0",
    "accelerate>=0.31",
]
quantization = [
    "auto-gptq>=0.7",
    "autoawq>=0.2",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "bandit>=1.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
