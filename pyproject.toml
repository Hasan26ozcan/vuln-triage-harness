[project]
name = "vuln-triage-harness"
version = "0.1.0"
description = "Vulnerability triage & patch-suggestion fine-tuning harness: SFT/LoRA/DPO on a code LLM, validated by an exec-based, four-tier eval harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hasan Ozcan" }]

dependencies = [
    "pydantic>=2.6,<3.0",
    "fastapi>=0.110,<0.145",
    "uvicorn[standard]>=0.29,<0.53",
    "sqlalchemy>=2.0,<2.1",
    "psycopg2-binary>=2.9,<3.0",
    "celery>=5.4,<5.7",
    "redis>=5.0,<9.0",
    "boto3>=1.34,<2.0",
    "typer>=0.12,<0.28",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
# Stage 1 collectors: NVD API client + Semgrep. Split out from base deps
# so schema-only tests (Stage 0) don't need Semgrep's Rust/OCaml binary.
data = [
    "httpx>=0.27,<0.29",
    "semgrep>=1.78,<2.0",
]
# Heavy ML deps are split out so CI (Stage 0-3, 6 tier 1-2, 10) never needs
# a GPU or a multi-GB torch install just to run schema/unit tests.
ml = [
    "torch>=2.10,<3.0",
    "transformers>=5.0,<6.0",
    "peft>=0.11,<0.21",
    "trl>=0.9,<2.0",
    "bitsandbytes>=0.43,<0.51",
    "sentence-transformers>=3.0,<6.0",
    "datasets>=2.19,<6.0",
    "accelerate>=0.31,<1.5",
]
quantization = [
    "auto-gptq>=0.7,<0.8",
    "autoawq>=0.2,<0.3",
]
dev = [
    "pytest>=8.2,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.5,<0.17",
    "bandit>=1.7,<1.10",
    "numpy>=1.26,<3.0",
    "mypy>=1.11,<3.0",
    "types-psycopg2>=2.9,<2.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.\\s*$",  # Protocol method stubs
]

[tool.mypy]
# SonarQube-style static type checking. Strict mode globally, with
# per-module overrides for modules that use lazy ML imports.
strict = true
plugins = ["pydantic.mypy"]
# Third-party packages (torch, transformers, etc.) are imported lazily
# inside functions — their stubs may not be installed.
ignore_missing_imports = true
# Don't follow imports into optional packages.
follow_imports = "silent"
# The codebase uses bare ``dict`` and ``list`` for Pydantic fields;
# don't require explicit type arguments everywhere.
disallow_any_generics = false
# Allow returning ``Any`` from functions that delegate to untyped deps.
warn_return_any = false

# --- Per-module overrides for ML-heavy code paths ---
# These modules use lazy imports for torch/transformers/peft/etc. and
# rely on runtime duck-typing that static analysis can't fully resolve.
# We relax strict checks there but still catch basic issues (unused vars, etc.).
[[tool.mypy.overrides]]
module = [
    "app.training.*",
    "app.quantization.*",
    "app.serving.backends",
    "app.serving.serve",
    "app.serving.cli",
    "app.evaluation.backends",
    "app.evaluation.tier4_llm_judge",
    "app.evaluation.tier3_exec",
    "app.evaluation.general_capability",
    "app.evaluation.baseline",
    "app.evaluation.cli",
    "app.storage.db",
    "app.storage.object_store",
    "app.data.cleaning.hf_dataset",
    "app.data.cleaning.pipeline",
    "app.data.cleaning.embeddings",
    "app.data.collectors.pipeline",
    "app.stage11.generator",
]
# These are ML-heavy / ORM / lazy-import modules; relax strict settings.
disallow_any_generics = false
warn_return_any = false
disallow_untyped_defs = false
disallow_untyped_calls = false
disable_error_code = [
    "attr-defined", "operator", "union-attr", "assignment", "misc",
    "var-annotated", "call-arg", "arg-type", "no-untyped-def",
    "no-untyped-call", "unused-ignore", "return-value",
]

# --- Test files ---
# Test files (unit + integration) use untyped helpers and fixtures liberally;
# strict type checking adds noise without catching real bugs in test code.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_any_generics = false
warn_return_any = false
disallow_untyped_defs = false
disallow_untyped_calls = false
disable_error_code = [
    "attr-defined", "operator", "union-attr", "assignment", "misc",
    "var-annotated", "call-arg", "arg-type", "no-untyped-def",
    "no-untyped-call", "unused-ignore", "return-value", "type-arg",
    "annotation-unchecked",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
