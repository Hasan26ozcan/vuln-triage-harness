name: SonarQube

# Static analysis (code quality, security, coverage) via SonarQube / SonarCloud.
# Runs after the main CI test job and the Gitleaks job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only run if the main test job succeeded.
concurrency:
  group: sonarqube-${{ github.ref }}
  # Cancel in-progress scans when a new push arrives.
  cancel-in-progress: true

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history for accurate change detection.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,data,ml]"

      - name: Run tests with coverage
        # Generate coverage.xml for SonarQube import.
        run: |
          pytest tests/unit -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Do NOT set SONAR_HOST_URL here for SonarCloud: GitHub Actions
          # sets an env var to an empty string (not "unset") when the
          # secret doesn't exist, and the scanner treats that empty
          # string as a real (but scheme-less) host URL, which crashes
          # with "Expected URL scheme 'http' or 'https'". If you switch
          # to an on-prem SonarQube instance, add this line back:
          #   SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          # and make sure the SONAR_HOST_URL secret is actually set.
        # projectKey, organization, sources, tests, and coverage paths all
        # live in sonar-project.properties at the repo root — no need to
        # (and don't) repeat/override them here with -D args.
