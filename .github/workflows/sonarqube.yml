name: SonarQube

# Static analysis (code quality, security, coverage) via SonarQube / SonarCloud.
# Runs after the main CI test job and the Gitleaks job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only run if the main test job succeeded.
concurrency:
  group: sonarqube-${{ github.ref }}
  # Cancel in-progress scans when a new push arrives.
  cancel-in-progress: true

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history for accurate change detection.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,data,ml]"

      - name: Run tests with coverage
        # Generate coverage.xml for SonarQube import.
        run: |
          pytest tests/unit -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Cache SonarQube scanner
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          # Use SONAR_HOST_URL if set (on-prem SonarQube), otherwise default
          # to SonarCloud.
          if [ -z "$SONAR_HOST_URL" ]; then
            echo "SONAR_HOST_URL not set — using SonarCloud defaults"
          fi
          sonar-scanner \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY || 'vuln-triage-harness' }} \
            -Dsonar.sources=app,scripts \
            -Dsonar.tests=tests \
            -Dsonar.python.version=3.11 \
            -Dsonar.coverage.reportPaths=coverage.xml \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL || 'https://sonarqube.org' }}
