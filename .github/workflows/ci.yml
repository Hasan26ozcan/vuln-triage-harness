name: CI

# Intentionally scoped to non-training checks: schema validation, lint,
# security scan. Training/quantization jobs are GPU-bound and run manually
# / nightly outside of this pipeline (see Stage 10 in the roadmap).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,data,ml]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Bandit (security scan)
        run: bandit -r app -q

      - name: Pytest (unit tests — Stages 0, 1, 2, 3)
        run: pytest tests/unit -v --cov=app --cov-report=term-missing
